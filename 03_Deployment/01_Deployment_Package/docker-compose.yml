version: '3.9'

services:
  # ─── Core Application Services ─────────────────────────────────────────────
  keycloak-service:
    build:
      context: ../../02_Source/01_Source Code
      dockerfile: keycloak-service/Dockerfile
    image: inventory-keycloak-service:latest
    container_name: inventory_keycloak_service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3200
      GRPC_PORT: 50051
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@inventory_mongo:27017/inventory?authSource=admin
      KEYCLOAK_SERVER_URL: http://inventory_keycloak:8080
      KEYCLOAK_REALM: inventory
      KEYCLOAK_CLIENT_ID: inventory-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ADMIN_CLIENT_ID: inventory-backend
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWKS_URI: http://inventory_keycloak:8080/realms/inventory/protocol/openid-connect/certs
    ports:
      - '3200:3200'
      - '50051:50051'
    networks:
      - inventory_network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'node' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api-gateway:
    build:
      context: ../../02_Source/01_Source Code
      dockerfile: api-gateway/Dockerfile
    image: inventory-api-gateway:latest
    container_name: inventory_api_gateway
    restart: unless-stopped
    depends_on:
      keycloak-service:
        condition: service_healthy
      inventory-management-service:
        condition: service_started
      ai-service:
        condition: service_started
      metrics-service:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      KEYCLOAK_SERVICE_GRPC_URL: keycloak-service:50051
      METRICS_SERVICE_GRPC_URL: metrics-service:6741
      BACKEND_URL: http://inventory-management-service:3100
      AI_SERVICE_URL: http://ai-service:3300
      JWKS_URI: http://inventory_keycloak:8080/realms/inventory/protocol/openid-connect/certs
      JWT_ISSUER: ${JWT_ISSUER:-http://inventory_keycloak:8080/realms/inventory}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3001:3001'
    networks:
      - inventory_network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  inventory-management-service:
    build:
      context: ../../02_Source/01_Source Code
      dockerfile: inventory-management-service/Dockerfile
    image: inventory-management-service:latest
    container_name: inventory_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3100
      GRPC_PORT: 50052
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@inventory_mongo:27017/inventory?authSource=admin
      KEYCLOAK_SERVER_URL: http://inventory_keycloak:8080
      KEYCLOAK_REALM: inventory
      KEYCLOAK_CLIENT_ID: inventory-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      JWKS_URI: http://inventory_keycloak:8080/realms/inventory/protocol/openid-connect/certs
      JWT_ISSUER: ${JWT_ISSUER:-http://inventory_keycloak:8080/realms/inventory}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      KEYCLOAK_SERVICE_GRPC_URL: keycloak-service:50051
      ELASTICSEARCH_NODE: http://inventory_elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-aHR0cHM6Ly9raWJhbmEuaW52ZW50b3J5LXN5c3RlbS5jbG91ZC8=}
      REDIS_HOST: inventory_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3100:3100'
      - '50052:50052'
    networks:
      - inventory_network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  ai-service:
    build:
      context: ../../02_Source/01_Source Code
      dockerfile: ai-service/Dockerfile
    image: inventory-ai-service:latest
    container_name: inventory_ai_service
    restart: unless-stopped
    depends_on:
      - inventory-management-service
    environment:
      NODE_ENV: production
      PORT: 3300
      BACKEND_GRPC_URL: inventory-management-service:50052
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_ROUTER_MODEL: ${GEMINI_ROUTER_MODEL:-gemini-2.5-flash}
      GEMINI_AGENT_MODEL: ${GEMINI_AGENT_MODEL:-gemini-2.5-flash}
      USE_GEMINI_ROUTER: ${USE_GEMINI_ROUTER:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3300:3300'
    networks:
      - inventory_network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  analytics-indexer-service:
    build:
      context: ../../02_Source/01_Source Code
      dockerfile: analytics-indexer-service/Dockerfile
    image: inventory-analytics-indexer-service:latest
    container_name: inventory_analytics_indexer
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@inventory_mongo:27017/inventory?authSource=admin
      ELASTICSEARCH_NODE: http://inventory_elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-aHR0cHM6Ly9raWJhbmEuaW52ZW50b3J5LXN5c3RlbS5jbG91ZC8=}
      ELASTICSEARCH_TLS_CA: ${ELASTICSEARCH_TLS_CA:-}
      REDIS_HOST: inventory_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS: 'false'
      SYNC_INTERVAL_CRON: ${SYNC_INTERVAL_CRON:-0 * * * *}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - inventory_network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  metrics-service:
    build:
      context: ../../02_Source/01_Source Code
      dockerfile: metrics-service/Dockerfile
    image: inventory-metrics-service:latest
    container_name: inventory_metrics_service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GRPC_PORT: 6741
      ELASTICSEARCH_NODE: http://inventory_elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-aHR0cHM6Ly9raWJhbmEuaW52ZW50b3J5LXN5c3RlbS5jbG91ZC8=}
      ELASTICSEARCH_TLS_CA: ${ELASTICSEARCH_TLS_CA:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '6741:6741'
    networks:
      - inventory_network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  inventory-management-web-app:
    build:
      context: ../../02_Source/01_Source Code
      dockerfile: inventory-management-web-app/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://api-gateway:3001}
    image: inventory-management-web-app:latest
    container_name: inventory_frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - '3000:80'
    networks:
      - inventory_network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  inventory_network:
    external: true

# ─── Usage ────────────────────────────────────────────────────────────────────
# 1. Ensure infrastructure is running (use base compose files):
#    docker-compose -f base/docker-compose-mongo.yml up -d
#    docker-compose -f base/docker-compose-keycloak.yml up -d
#    docker-compose -f base/docker-compose-redis.yml up -d
#    docker-compose -f base/docker-compose-elasticsearch.yml up -d
#
# 2. Create network if not exists:
#    docker network create inventory_network
#
# 3. Build and start application services:
#    docker-compose build
#    docker-compose up -d
#
# 4. Check status:
#    docker-compose ps
#    docker-compose logs -f
