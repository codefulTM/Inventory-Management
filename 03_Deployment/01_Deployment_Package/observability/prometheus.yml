# ==============================================================================
# PROMETHEUS CONFIGURATION - CẤU HÌNH THU THẬP METRICS
# ==============================================================================
# File này định nghĩa các targets mà Prometheus sẽ quét (scrape) để thu thập metrics
# Prometheus sẽ truy cập vào endpoint /metrics của mỗi target theo chu kỳ scrape_interval
# 
# Cấu trúc: Mỗi job define một nhóm targets có cùng loại (node, cadvisor, mongodb, v.v.)
# Targets được định danh bằng container_name (Docker internal DNS)
# ==============================================================================

# Thiết lập chung: scrape mỗi 5 giây (mặc định thường là 15s hoặc 1m)
global:
  scrape_interval: 5s

# Danh sách các job cần scrape metrics
scrape_configs:
  # ============================================================================
  # JOB: NODE EXPORTER
  # - Giám sát tài nguyên hệ thống: CPU, RAM, Disk, Network
  # - Target: monitoring_node_exporter:9100 (container name + port)
  # - Metrics path: /metrics (mặc định)
  # ============================================================================
  - job_name: 'node'
    static_configs:
      - targets: ['monitoring_node_exporter:9100']

  # ============================================================================
  # JOB: CADVISOR
  # - Giám sát Docker containers: tài nguyên từng container, stats, info
  # - Target: monitoring_cadvisor:8080 (cAdvisor chạy port 8080 trong container)
  # - Cung cấp cái nhìn tổng quan về hiệu năng containers
  # ============================================================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['monitoring_cadvisor:8080']

  # ============================================================================
  # JOB: MONGODB EXPORTER
  # - Giám sát MongoDB: connections, operations, replication status
  # - Target: monitoring_mongodb_exporter:9216
  # - Cần MongoDB đang chạy và exporter có quyền truy cập
  # ============================================================================
  - job_name: 'mongodb'
    static_configs:
      - targets: ['monitoring_mongodb_exporter:9216']

  # ============================================================================
  # JOB: BACKEND (NestJS API)
  # - Giám sát backend thông qua endpoint /metrics (cần tích hợp prom-client)
  # - Target: inventory_backend:3001 (backend container name)
  # - Nếu chưa tích hợp prom-client, job này sẽ không có metrics
  # ============================================================================
  - job_name: 'backend'
    static_configs:
      - targets: ['inventory_backend:3001']

  # ============================================================================
  # JOB: KEYCLOAK
  # - Giám sát Keycloak (Identity Provider) qua metrics endpoint
  # - Target: inventory_keycloak:8080
  # - Keycloak cần bật metrics (thường qua JMX hoặc SPI)
  # ============================================================================
  - job_name: 'keycloak'
    static_configs:
      - targets: ['inventory_keycloak:8080']

  # ============================================================================
  # JOB: JENKINS
  # - Giám sát Jenkins CI/CD server
  # - metrics_path: /prometheus (Jenkins Prometheus plugin endpoint)
  # - Target: jenkins:8080
  # - Cần cài đặt Prometheus plugin trong Jenkins
  # ============================================================================
  - job_name: 'jenkins'
    metrics_path: /prometheus
    static_configs:
      - targets: ['jenkins:8080']