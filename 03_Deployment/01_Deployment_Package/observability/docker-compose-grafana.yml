version: '3.8'

services:
  prometheus:
    image: prom/prometheus
    container_name: monitoring_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
    networks:
      - inventory_network

  grafana:
    image: grafana/grafana
    container_name: monitoring_grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    networks:
      - inventory_network

  node-exporter:
    image: prom/node-exporter
    container_name: monitoring_node_exporter
    restart: always
    ports:
      - "9100:9100"
    networks:
      - inventory_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: monitoring_cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - inventory_network

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: monitoring_mongodb_exporter
    environment:
      - MONGODB_URI=mongodb://admin:password123@inventory_mongo:27017/inventory
    ports:
      - "9216:9216"
    restart: always
    networks:
      - inventory_network

networks:
  inventory_network:
    external: true

volumes:
  grafana_data: