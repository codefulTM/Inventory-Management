# ==============================================================================
# DOCKER COMPOSE - MONITORING STACK CHO INVENTORY MANAGEMENT SYSTEM
# ==============================================================================
# File này định nghĩa toàn bộ hệ thống giám sát (monitoring stack) sử dụng Docker
# Bao gồm: Prometheus (thu thập metrics), Grafana (trực quan hóa), 
#           Node Exporter (metrics hệ thống), cAdvisor (metrics container),
#           MongoDB Exporter (metrics database)
#
# Mạng: Tất cả services kết nối vào Docker network 'inventory_network' (external)
# Cách chạy: docker compose -f docker-compose-grafana.yml up -d
# ==============================================================================

version: '3.8'

services:
  # ============================================================================
  # PROMETHEUS - Công cụ thu thập và lưu trữ metrics
  # - Quét (scrape) các targets định nghĩa trong prometheus.yml mỗi 5s
  # - Cung cấp giao diện truy vấn PromQL tại http://localhost:9090
  # - Làm nguồn dữ liệu (datasource) cho Grafana
  # ============================================================================
  prometheus:
    image: prom/prometheus
    container_name: monitoring_prometheus
    volumes:
      # Mount file cấu hình scrape targets từ host vào container
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"  # Prometheus UI/API
    restart: always
    networks:
      - inventory_network

  # ============================================================================
  # GRAFANA - Công cụ trực quan hóa dữ liệu (Dashboard)
  # - Cung cấp giao diện web tại http://localhost:3002
  # - Đăng nhập mặc định: admin / admin123
  # - Tự động provision datasource Prometheus qua file trong thư mục provisioning
  # - Lưu trữ dashboard và cấu hình vào volume 'grafana_data'
  # ============================================================================
  grafana:
    image: grafana/grafana
    container_name: monitoring_grafana
    ports:
      - "3002:3000"  # Map port 3000 trong container ra 3002 trên host
    volumes:
      - grafana_data:/var/lib/grafana  # Persist data Grafana
    restart: always
    networks:
      - inventory_network

  # ============================================================================
  # NODE EXPORTER - Xuất metrics của hệ thống (Linux/Windows host)
  # - Thu thập: CPU, RAM, Disk, Network, Load average...
  # - Metrics có tại http://localhost:9100/metrics
  # - Job name trong Prometheus: 'node'
  # ============================================================================
  node-exporter:
    image: prom/node-exporter
    container_name: monitoring_node_exporter
    restart: always
    ports:
      - "9100:9100"
    networks:
      - inventory_network

  # ============================================================================
  # CAdvisor (Container Advisor) - Giám sát Docker containers
  # - Thu thập metrics của tất cả containers: CPU, RAM, Network, Disk I/O
  # - Cung cấp thông tin chi tiết về container resources usage
  # - Truy cập tại http://localhost:8081 (đã map từ 8080 của container)
  # - Cần quyền truy cập host filesystem và Docker socket để hoạt động
  # ============================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: monitoring_cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"  # cAdvisor mặc định chạy port 8080 trong container
    volumes:
      # Read-only mount các thư mục hệ thống cần thiết để thu thập metrics
      - /:/rootfs:ro                    # Root filesystem
      - /var/run:/var/run:ro            # Docker socket info
      - /sys:/sys:ro                    # System info (CPU, memory)
      - /var/lib/docker/:/var/lib/docker:ro  # Docker data
      - /dev/disk/:/dev/disk:ro         # Disk info
    privileged: true  # Cần quyền cao để truy cập thông tin hệ thống
    devices:
      - /dev/kmsg       # Kernel message interface cho một số metrics
    networks:
      - inventory_network

  # ============================================================================
  # MONGODB EXPORTER - Xuất metrics của MongoDB
  # - Thu thập thông tin về: connections, operations, replication, v.v.
  # - Kết nối tới MongoDB qua MONGODB_URI
  # - Metrics có tại http://localhost:9216/metrics
  # - Job name trong Prometheus: 'mongodb'
  # ============================================================================
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: monitoring_mongodb_exporter
    environment:
      # URI kết nối tới MongoDB (sử dụng container name 'inventory_mongo')
      - MONGODB_URI=mongodb://admin:password123@inventory_mongo:27017/inventory
    ports:
      - "9216:9216"
    restart: always
    networks:
      - inventory_network

# ============================================================================
# NETWORK - Sử dụng external network 'inventory_network'
# - Network này phải được tạo trước: docker network create inventory_network
# - Cho phép các container giao tiếp với nhau qua container name
# ============================================================================
networks:
  inventory_network:
    external: true  # Network đã tồn tại, không tạo mới

# ============================================================================
# VOLUMES - Persistent storage cho Grafana
# - Dữ liệu dashboard, users, settings được lưu trữ bền vững
# ============================================================================
volumes:
  grafana_data: