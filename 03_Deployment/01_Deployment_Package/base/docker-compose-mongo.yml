version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: inventory_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: inventory
    volumes:
      - ./data-mongo:/data/db
      - /home/ubuntu/codes/Inventory-Management/02_Source/01_Source Code/database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - inventory_network

networks:
  inventory_network:
    external: true

volumes:
  mongodb_data: