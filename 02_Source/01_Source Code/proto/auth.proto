syntax = "proto3";

package auth;

// ─── Auth Service ─────────────────────────────────────────────────────────────
service AuthService {
  rpc Login (LoginRequest) returns (TokenResponse);
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Refresh (RefreshRequest) returns (TokenResponse);
  rpc Logout (LogoutRequest) returns (MessageResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (MessageResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (MessageResponse);
  rpc GetMe (GetMeRequest) returns (UserResponse);
}

// ─── Keycloak Admin Service (called by backend's user module) ─────────────────
service KeycloakAdminService {
  rpc CreateKeycloakUser (CreateKeycloakUserRequest) returns (CreateKeycloakUserResponse);
  rpc UpdateKeycloakUser (UpdateKeycloakUserRequest) returns (MessageResponse);
  rpc DeleteKeycloakUser (DeleteKeycloakUserRequest) returns (MessageResponse);
  rpc SetUserEnabled (SetUserEnabledRequest) returns (MessageResponse);
  rpc ResetUserPassword (ResetUserPasswordRequest) returns (MessageResponse);
}

// ─── Messages ─────────────────────────────────────────────────────────────────

message LoginRequest {
  string username = 1;
  string password = 2;
  string ip = 3;
  string user_agent = 4;
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  int32 refresh_expires_in = 4;
  string token_type = 5;
  string session_state = 6;
  string scope = 7;
  UserInfo user = 8;
}

message UserInfo {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  string keycloak_id = 5;
  bool is_active = 6;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  string message = 1;
  UserInfo user = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
  string username = 2;
  string ip = 3;
  string user_agent = 4;
}

message ForgotPasswordRequest {
  string email = 1;
  string ip = 2;
  string user_agent = 3;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
  string ip = 3;
  string user_agent = 4;
}

message GetMeRequest {
  string keycloak_id = 1;
}

message UserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  string keycloak_id = 5;
  bool is_active = 6;
  string lock_type = 7;
  string lock_reason = 8;
}

message MessageResponse {
  string message = 1;
}

// ─── Keycloak Admin Messages ───────────────────────────────────────────────────

message CreateKeycloakUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string role = 4;
  string first_name = 5;
  string last_name = 6;
}

message CreateKeycloakUserResponse {
  string keycloak_id = 1;
}

message UpdateKeycloakUserRequest {
  string keycloak_id = 1;
  string email = 2;
  string role = 3;
  string first_name = 4;
  string last_name = 5;
}

message DeleteKeycloakUserRequest {
  string keycloak_id = 1;
}

message SetUserEnabledRequest {
  string keycloak_id = 1;
  bool enabled = 2;
}

message ResetUserPasswordRequest {
  string keycloak_id = 1;
  string new_password = 2;
}
