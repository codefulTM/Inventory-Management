syntax = "proto3";

package metrics;

/**
 * MetricsReportsService — gRPC service exposing 4 statistical report RPCs.
 * Called by api-gateway; routed from HTTP GET /reports/*.
 */
service MetricsReportsService {
  rpc GetInventoryStatus  (InventoryStatusRequest)  returns (InventoryStatusResponse);
  rpc GetMaterialUsage    (MaterialUsageRequest)     returns (MaterialUsageResponse);
  rpc GetQcPerformance    (QcPerformanceRequest)     returns (QcPerformanceResponse);
  rpc GetAuditReport      (AuditReportRequest)       returns (AuditReportResponse);
  rpc GetInventoryTrend   (TrendRequest)             returns (InventoryTrendResponse);
  rpc GetMaterialUsageTrend (TrendRequest)           returns (MaterialUsageTrendResponse);
  rpc GetQcTrend          (TrendRequest)             returns (QcTrendResponse);
  rpc GetAuditTrend       (TrendRequest)             returns (AuditTrendResponse);
}

message TrendRequest {
  string from = 1;       // ISO 8601 date string, optional
  string to = 2;         // ISO 8601 date string, optional
  string interval = 3;   // day | week | month, default day
  int32  limit = 4;      // optional (for top-N)
}

// ─── Inventory Status ──────────────────────────────────────────────────────

message InventoryStatusRequest {}

message InventoryStatusItem {
  string material_id     = 1;
  string lot_id          = 2;
  double quantity        = 3;
  string status          = 4;
  string expiration_date = 5;  // ISO 8601 string, empty if absent
}

message InventoryStatusResponse {
  string generated_at = 1;   // ISO 8601
  int32  total_lots   = 2;
  repeated InventoryStatusItem items = 3;
}

// ─── Material Usage ────────────────────────────────────────────────────────

message MaterialUsageRequest {
  string from = 1;  // ISO 8601 date string, optional
  string to   = 2;  // ISO 8601 date string, optional
}

message MaterialUsageItem {
  string material_id       = 1;
  int32  transaction_count = 2;
  double total_quantity    = 3;
}

message MaterialUsageResponse {
  string generated_at = 1;
  string from         = 2;
  string to           = 3;
  repeated MaterialUsageItem items = 4;
}

// ─── QC Performance ────────────────────────────────────────────────────────

message QcPerformanceRequest {}

message QcPerformanceItem {
  string supplier_name = 1;
  int32  approved      = 2;
  int32  rejected      = 3;
  double quality_rate  = 4;
}

message QcPerformanceResponse {
  string generated_at = 1;
  repeated QcPerformanceItem items = 2;
}

// ─── Audit Report ──────────────────────────────────────────────────────────

message AuditReportRequest {
  int32 page = 1;  // 0-based, default 0
  int32 size = 2;  // default 20
}

message AuditEntry {
  string action       = 1;
  string entity       = 2;
  string performed_by = 3;
  string performed_at = 4;  // ISO 8601
  string details      = 5;  // JSON-encoded string
}

message AuditReportResponse {
  string generated_at = 1;
  repeated AuditEntry entries = 2;
}

// ─── Inventory Trend ───────────────────────────────────────────────────────

message InventoryTrendPoint {
  string period = 1;
  int32 lot_count = 2;
  double total_quantity = 3;
}

message InventoryTrendResponse {
  string generated_at = 1;
  string from = 2;
  string to = 3;
  string interval = 4;
  repeated InventoryTrendPoint points = 5;
}

// ─── Material Usage Trend ──────────────────────────────────────────────────

message MaterialUsageTrendPoint {
  string period = 1;
  string material_id = 2;
  int32 transaction_count = 3;
  double total_quantity = 4;
}

message MaterialUsageTrendResponse {
  string generated_at = 1;
  string from = 2;
  string to = 3;
  string interval = 4;
  repeated MaterialUsageTrendPoint points = 5;
}

// ─── QC Trend ──────────────────────────────────────────────────────────────

message QcTrendPoint {
  string period = 1;
  int32 pass_count = 2;
  int32 fail_count = 3;
  int32 pending_count = 4;
}

message QcSupplierRankingItem {
  string supplier_name = 1;
  int32 pass_count = 2;
  int32 fail_count = 3;
  double quality_rate = 4;
}

message QcTrendResponse {
  string generated_at = 1;
  string from = 2;
  string to = 3;
  string interval = 4;
  repeated QcTrendPoint points = 5;
  repeated QcSupplierRankingItem supplier_rankings = 6;
}

// ─── Audit Trend ───────────────────────────────────────────────────────────

message AuditTrendPoint {
  string period = 1;
  int32 activity_count = 2;
  int32 unique_users = 3;
}

message AuditTrendResponse {
  string generated_at = 1;
  string from = 2;
  string to = 3;
  string interval = 4;
  repeated AuditTrendPoint points = 5;
}
