global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['monitoring_node_exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['monitoring_cadvisor:8080']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['monitoring_mongodb_exporter:9216']

  - job_name: 'backend'
    static_configs:
      - targets: ['inventory_backend:3001']

  - job_name: 'keycloak'
    static_configs:
      - targets: ['inventory_keycloak:8080']

  - job_name: 'jenkins'
    metrics_path: /prometheus
    static_configs:
      - targets: ['jenkins:8080']