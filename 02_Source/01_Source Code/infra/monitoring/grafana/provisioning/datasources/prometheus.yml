# ==============================================================================
# GRAFANA DATASOURCE PROVISIONING - CẤU HÌNH PROMETHEUS DATASOURCE TỰ ĐỘNG
# ==============================================================================
# File này cho phép Grafana tự động tạo datasource Prometheus khi khởi động
# (Không cần cấu hình thủ công qua Web UI)
#
# Cách hoạt động:
#   - Grafana đọc thư mục provisioning/datasources/ khi startup
#   - Tự động thêm datasource được định nghĩa trong file .yml này
#   - Grafana sẽ sử dụng datasource này làm mặc định để vẽ biểu đồ
#
# apiVersion: 1 - Phiên bản API provisioning của Grafana (hiện tại là 1)
# ==============================================================================

apiVersion: 1

datasources:
  # ============================================================================
  # PROMETHEUS DATASOURCE
  # ----------------------------------------------------------------------------
  # Đây là nguồn dữ liệu chính cung cấp metrics cho tất cả dashboards
  # URL trỏ tới container 'monitoring_prometheus' trên port 9090 (Docker network)
  # ============================================================================
  - name: Prometheus                  # Tên hiển thị trong Grafana
    type: prometheus                  # Loại datasource (prometheus)
    url: http://monitoring_prometheus:9090   # URL Prometheus (Docker internal DNS)
    access: proxy                     # Grafana proxy request tới Prometheus
    isDefault: true                   # Đây là datasource mặc định
    editable: false                   # Không cho phép sửa qua Web UI

    # Cấu hình bổ sung cho Prometheus datasource
    jsonData:
      httpMethod: POST                # Dùng POST thay vì GET (hỗ trợ query phức tạp)
      scrapeInterval: 5s              # Khoảng thời gian scrape (đồng bộ với Prometheus)
      timeInterval: 5s                # Khoảng thời gian mặc định cho queries
